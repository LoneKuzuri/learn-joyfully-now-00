name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format and commit source
        run: |
          npx prettier --write "src/**/*.{ts,tsx}" "supabase/functions/**/*.ts" ".github/workflows/ci.yml" "package.json"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src supabase/functions .github/workflows/ci.yml package.json
            git commit -m "style: format LMS implementation"
            git fetch origin "${{ github.head_ref || github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
      - run: npm run lint
      - run: npm run build
